# Curated annotations for the 3-Eyes master automation catalog (GH-195).
#
# COMMITTED — this is human curation, not machine state. The rendered CATALOG.md is
# GENERATED from this file ⋈ this device's live `three_eyes observe`, and is
# gitignored (it lists a specific machine's agents). Regenerate: `three_eyes catalog --write`.
#
# When `three_eyes catalog --check` reports an UNCLASSIFIED agent, add an
# [agent."<launchd-label>"] block here to file it into the catalog.
#
# status: managed | to-adopt | observe | server | system
#   managed  = a 3-Eyes registry job (🟢)    to-adopt = bring into the registry next (🎯)
#   observe  = seen, no plan yet (👁)          server   = long-running service, see servers.md (⚙️)
#   system   = vendor/OS, ignore (⚙️)

system_order = ["managed", "claude", "xyz", "rebalance", "cactus-sleuth", "ga4", "hq-misc", "servers"]

[system_names]
managed = "3-Eyes (managed)"
claude = "Claude · Skills & Prompt Logs"
xyz = "XYZ swarm"
rebalance = "Rebalance-OS · collectors & sync"
cactus-sleuth = "Cactus Needle & Sleuth sentinels (the other two eyes)"
ga4 = "GA4 → BigQuery daily pulls"
hq-misc = "HQ · vault · misc"
servers = "Long-running servers (details in ~/bin/servers.md)"

[agent."com.rebalance-os.3eyes.collector-health"]
