# 3-Eyes collector-health job (GH-195) — the Rebalance collector-health sentinel,
# expressed as a registry job. Observe-first: this is DECLARED here, but 3-Eyes
# does not own its scheduling until the operator activates and installs it. The
# existing com.rebalance-os.health-check* launchd agents keep running meanwhile.
#
# NOTE: top-level keys (id, command, routes, ...) MUST precede any [table] header —
# in TOML a bare key after `[breakers]` would bind to that table, not the job.

id = "collector-health"
command = "collector-health"
description = "Watch ingest freshness across GitHub / Slack-Sleuth / Gmail / Google Calendar / Zapier collectors."
enabled = true
routes = ["pdda-inbox", "notify"]

[schedule.launchd]
StartInterval = 1800

[rules]
fire_when = "stale_minutes > 90"
quiet_hours = "22:00-07:00 PT"

[breakers]
single_instance = true
max_rss_gb = 8
trip_after_failures = 3

[relief]
llm_daily_max = 8
llm_per_run_max = 5
