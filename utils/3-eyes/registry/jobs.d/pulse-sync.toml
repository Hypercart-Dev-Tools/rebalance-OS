# 3-Eyes adoption of the incumbent hourly pulse publisher (GH-195 P8 Wave 2).

id = "pulse-sync"
command = "pulse-sync"
description = "Publish the Rebalance pulse hourly on the hour from 06:00 through 23:00 local."
enabled = true
routes = ["log-only"]
supersedes = ["com.rebalance-os.pulse-sync"]

[schedule.launchd]
StartCalendarInterval = [
  { Hour = 6, Minute = 0 },
  { Hour = 7, Minute = 0 },
  { Hour = 8, Minute = 0 },
  { Hour = 9, Minute = 0 },
  { Hour = 10, Minute = 0 },
  { Hour = 11, Minute = 0 },
  { Hour = 12, Minute = 0 },
  { Hour = 13, Minute = 0 },
  { Hour = 14, Minute = 0 },
  { Hour = 15, Minute = 0 },
  { Hour = 16, Minute = 0 },
  { Hour = 17, Minute = 0 },
  { Hour = 18, Minute = 0 },
  { Hour = 19, Minute = 0 },
  { Hour = 20, Minute = 0 },
  { Hour = 21, Minute = 0 },
  { Hour = 22, Minute = 0 },
  { Hour = 23, Minute = 0 },
]

[breakers]
single_instance = true
max_rss_gb = 8
trip_after_failures = 3
