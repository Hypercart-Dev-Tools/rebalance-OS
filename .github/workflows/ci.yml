name: CI

# `development` is the integration branch and the repo default — every feature
# branch is cut from it and merged back into it. Triggering on `main` alone meant
# the branch that receives all the work had ZERO checks, which is how GH-124
# merged 10 failing tests on 2026-07-11 and went unnoticed for 9 days (GH-178).
# `main` stays listed so release merges are still gated. (GH-177)
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # server extra: rebalance.web imports FastAPI at module level, so
          # the web-surface tests need it. pytest: the suite is pytest-run
          # locally and some modules are pytest-style (unittest discover
          # can't collect them, and one imports pytest at module scope).
          pip install -e ".[calendar,server]" pytest

      # tests/test_pulse_reconcile.py drives real `git pull --rebase` against a
      # throwaway clone. Without an identity that dies with code 128 on a fresh
      # runner — a CI-environment gap, not a product bug, and one only CI ever
      # hits (developer machines always have a global identity). (GH-177)
      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@rebalance-os.invalid"
          git config --global user.name "rebalance-OS CI"
          git config --global init.defaultBranch main

      - name: Run tests
        run: python -m pytest tests/ utils/3-eyes/tests -q

      - name: 3-Eyes dashboard is in sync with the registry (GH-195)
        run: python -m three_eyes.dashboard --check
        working-directory: utils/3-eyes
        env:
          PYTHONPATH: ${{ github.workspace }}/utils/3-eyes

      - name: Check for raw datetime parsing (use parse_calendar_dt)
        run: |
          if grep -rn "replace('Z'" src/rebalance/ingest/ --include="*.py" \
               | grep -v "# raw-ok" | grep -v calendar_helpers.py; then
            echo "::error::Raw Z-replace found — use parse_calendar_dt() from calendar_helpers.py"
            exit 1
          fi

      - name: Check for raw duration calculation (use event_duration_minutes)
        run: |
          if grep -rn "total_seconds() / 60" src/rebalance/ --include="*.py" \
               | grep -v "# raw-ok" | grep -v calendar_helpers.py; then
            echo "::error::Raw duration calc found — use event_duration_minutes() from calendar_helpers.py"
            exit 1
          fi
