    name: "doctor launchd check reads the run JSON, not a stale launchctl status"
    reviewer: agy
    brief: PROJECT/2-WORKING/GH-146-HEALTH-SIGNAL-ACCURACY/briefs/p2-launchd-json.md
    artifact: src/rebalance/doctor.py,tests/test_doctor_launchd.py
    turn_timeout_s: 1200
    max_review_rounds: 2

  - id: gh146-p3-device-scoping
    name: "Device-scoped checks stop warning on the wrong device"
