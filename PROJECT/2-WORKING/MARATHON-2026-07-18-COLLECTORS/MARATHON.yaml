    artifact: src/rebalance/ingest/_http.py
    turn_timeout_s: 1200
    max_review_rounds: 2
    # gate: .venv/bin/python -m pytest tests/ -k "github_scan or github_client or http" -q

  - id: coll-p3-138-job-liveness
    name: "GH-138: doctor warns when a SCHEDULER.md job is not loaded"
    reviewer: agy
    brief: PROJECT/2-WORKING/MARATHON-2026-07-18-COLLECTORS/briefs/p3-138-job-liveness.md
    artifact: src/rebalance/doctor.py
    turn_timeout_s: 900
    max_review_rounds: 2
    # gate: .venv/bin/python -m pytest tests/ -k "doctor or scheduler_policy" -q

  # --- WAVE 2 — shares doctor.py with p3, must follow it -------------------

  - id: coll-p4-127-health-predicate
    name: "GH-127: registry-driven content/volume health predicate"
    reviewer: agy
    brief: PROJECT/2-WORKING/MARATHON-2026-07-18-COLLECTORS/briefs/p4-127-health-predicate.md
