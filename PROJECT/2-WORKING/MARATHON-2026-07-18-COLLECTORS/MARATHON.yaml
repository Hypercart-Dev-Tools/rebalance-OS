  # --- WAVE 1 — p1..p3 are disjoint and may run concurrently ---------------

  - id: coll-p1-139-dupe-emitter
    name: "GH-139: delete the duplicate pulse-collector check emitter"
    reviewer: agy
    brief: PROJECT/2-WORKING/MARATHON-2026-07-18-COLLECTORS/briefs/p1-139-dupe-emitter.md
    artifact: scripts/health_issue_reporter.py
    turn_timeout_s: 900
    max_review_rounds: 2
    # gate: .venv/bin/python -m pytest tests/test_health_issue_reporter.py -q

  - id: coll-p2-144-fanout
    name: "GH-144: client-level request attribution + reduce per-PR fan-out"
    reviewer: agy
