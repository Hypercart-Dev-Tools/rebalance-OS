# MARATHON — GH-154 theme color picker, tokenization phases only.
#
#   relay-automation/marathon.sh --plan PROJECT/2-WORKING/GH-154-THEME-COLOR-PICKER/MARATHON.yaml
#
# SCOPE: this plan covers P0-P3 (tokenization) and STOPS. P4 (theme runtime) and P5 (the Settings
# page) are deliberately NOT automated — their exit conditions are "no flash at first paint" and
# "the Settings page looks right", i.e. judgments about a rendering rather than assertions. GH-136
# invariant #8 exists precisely because tests and DOM assertions both passed a sidebar in which
# every linked row had a zero-width body; only a human looking at it caught that. Automating a
# phase whose success criterion is "someone looked and it seemed right" is how Day 0 shipped two
# defects that the automated reviewer approved (invariant #10).
#
# SHAPE: p0 runs solo and defines the full :root vocabulary. p1/p2/p3 then run as ONE CONCURRENT
# WAVE — they are pure literal->var() rewrites against a vocabulary that already exists, and they
# touch DISJOINT files, so they cannot conflict:
#     p1 -> src/rebalance/web_components.py
#     p2 -> src/rebalance/web.py
#     p3 -> scripts/pulse_web.py
# web/pulse.html is regenerated by p3 but is a gitignored build artifact (invariant #6), so it is
# not an artifact of any phase and must never be hand-edited.
#
# BASELINE: p0 captures the pre-change Playwright screenshots that every later phase diffs against.
# That is what makes these phases safe to automate at all — the exit condition is a pixel diff a
# machine can check exactly, not an opinion.

name: gh-154-tokenize
phases:
  - id: p0
    name: Vocabulary, full :root, and the rename
    reviewer: codex
    brief: PROJECT/2-WORKING/GH-154-THEME-COLOR-PICKER/briefs/p0-vocabulary.md
    artifact: src/rebalance/web_components.py,PROJECT/2-WORKING/GH-154-THEME-COLOR-PICKER.md
    turn_timeout_s: 1800
    max_review_rounds: 3

  - id: p1
    name: Tokenize the shared shell
    reviewer: codex
    brief: PROJECT/2-WORKING/GH-154-THEME-COLOR-PICKER/briefs/p1-shell.md
    artifact: src/rebalance/web_components.py
    turn_timeout_s: 1800
    depends_on: p0
    max_review_rounds: 2

  - id: p2
    name: Tokenize web.py
    reviewer: agy
    brief: PROJECT/2-WORKING/GH-154-THEME-COLOR-PICKER/briefs/p2-webpy.md
    artifact: src/rebalance/web.py
    turn_timeout_s: 1800
    depends_on: p0
    max_review_rounds: 2

  - id: p3
    name: Tokenize PAGE_CSS and the canvas palettes
    reviewer: codex
    brief: PROJECT/2-WORKING/GH-154-THEME-COLOR-PICKER/briefs/p3-pagecss.md
    artifact: scripts/pulse_web.py
    turn_timeout_s: 2700
    depends_on: p0
    max_review_rounds: 3
