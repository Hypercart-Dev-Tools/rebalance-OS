#
# ---------------------------------------------------------------------------
# WHY THESE PHASES, IN THIS ORDER  (write-sets verified against the tree)
# ---------------------------------------------------------------------------
#   p1 (#152) scripts/pulse_sync.sh     <- disjoint
#   p2 (#146) src/rebalance/doctor.py   <- disjoint from p1
#   p3 (#153) src/rebalance/doctor.py   <- COLLIDES with p2, must follow it
#                (also edits src/rebalance/health.py — disjoint from everyone)
#
# p1/p2 are mutually disjoint; p3 shares doctor.py with p2 (it adds the severity
# field to the same Check dataclass p2 corrects) and is sequenced after it via
# depends_on. marathon.sh runs phases ONE AT A TIME in resolved order, halting on
# first failure — sequential, no worktree/parallel machinery. The disjoint
# analysis buys correctness (why p3 declares depends_on, the others need not),
# not wall-clock.
#
# ---------------------------------------------------------------------------
# GATE (read before firing)
# ---------------------------------------------------------------------------
# marathon-drive's default pre-advance gate is `bash <root>/validate.sh`, which
# DOES NOT EXIST here. Always pass an explicit --pre-advance-cmd (above).
# Do NOT gate on the full `pytest tests/`: the suite carries ~15 pre-existing
# failures (auto_promote, hiqs_pipeline, project_inference, …) unrelated to this
# work; a full-suite gate blocks every phase on unrelated debt. The scoped
# selector above is the union gate for all three phases — verify it green at
# baseline (`--dry-run` first) before the first fire.
#
# depends_on is a SCALAR, not a list. `depends_on: [id]` parses as the literal
# string "[id]" and fails with "depends_on unknown phase".
#
# ---------------------------------------------------------------------------
# BUILDER / COST
# ---------------------------------------------------------------------------
# Builder defaults to `codex` (subscription-billed, no per-call API charge).
# Reviewer `agy` is the other cost-blind option. `--builder claude` would spawn
# API-billed headless turns — not used here.

