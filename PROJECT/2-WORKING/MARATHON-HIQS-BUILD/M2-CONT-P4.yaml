# M2-CONT-P4.yaml — final M2 phase. p2 and p3 are approved and their gates pass.
#
# Third continuation file, same reason as M2-CONT-P2P4.yaml: marathon.sh walks its plan from phase 1
# on every invocation and has no memory of which phases passed, so an approved phase left in the
# plan gets re-opened and re-reviewed. That is not free — a reviewer re-sweeping settled code always
# finds something new to request and burns the round cap on work that was already done (observed on
# hiqs-m2-p1). A completed phase leaves the plan.
#
# STATE THIS CONTINUES FROM (all verified, not assumed):
#   hiqs-m2-p1  approved — vault source + `vault = "hiqs.sources.vault:SOURCE"` entry point
#   hiqs-m2-p2  approved — projection + the §5 attestation contract (SyncReport.units_ok, Doc.unit);
#                          all four attestation workarounds deleted from docs_index.py
#   hiqs-m2-p3  RELAY APPROVED, gate then failed on ModuleNotFoundError: numpy — an environment gap,
#                          not a code defect. numpy installed into HiQS/.venv and declared in
#                          pyproject.toml; the full suite now passes 92/1 xfailed. p3's artifacts are
#                          therefore complete and are NOT re-run here.
#
# Reviewer is pinned codex, so this MUST run with --builder agy.
#
# Run:
#   RELAY_WORKTREE_ISOLATION=0 .xyz/relay-automation/marathon.sh \
#     --plan PROJECT/2-WORKING/MARATHON-HIQS-BUILD/M2-CONT-P4.yaml \
#     --builder agy \
#     --pre-advance-cmd 'HiQS/.venv/bin/python -m pytest HiQS/tests -q'
#
# AFTER THIS PHASE: operator checkpoint A. Do not fire M3. M2 builds the eval RUNNER; the answer key
# (eval_queries.json) must be authored by the operator from memory per HIQS-PROJECT.md §6.3, and the
# vector-leg gate there can remove torch from the plan and reshape M4/M5.

name: hiqs-m2-cont-p4
phases:
  - id: hiqs-m2-p4
    name: "eval_retrieval.py — the runner (NOT the answer key)"
    reviewer: codex
    brief: PROJECT/2-WORKING/MARATHON-HIQS-BUILD/briefs/m2-p4-eval-runner.md
    artifact: HiQS/tests/eval_retrieval.py,HiQS/tests/test_eval_retrieval.py
    turn_timeout_s: 1800
    max_review_rounds: 3
