# MARATHON.yaml — the 10 lanes from MARATHON-PLAN-2026-07-30.md, as marathon.sh phases.
#
# Derived from PROJECT/2-WORKING/MARATHON-PLAN-2026-07-30.md and the preflight packets under
# relay-system/preflight/2026-07-30/. Every lane exited 0 (ready) on 2026-07-30 against the
# vendored harness at source_commit dcc8507.
#
# SEQUENCING. marathon.sh runs phases STRICTLY ONE AT A TIME (GH-241); depends_on constrains
# order, it does not create concurrency. The plan document's "waves" describe which lanes COULD
# safely overlap and are therefore advisory here — they are why no depends_on is needed between
# same-wave lanes, not a statement that they run together. Order below is the plan's own ranking
# (score ascending), which is also its wave order.
#
# GATE. marathon.sh takes ONE --pre-advance-cmd for the whole run; there is no per-phase gate
# field. The packets recommend a DIFFERENT, issue-scoped gate per lane (ten of them, nine pytest
# -k filters plus one shell script), so no single command reproduces them. The only command broad
# enough to cover every lane is the full suite:
#
#     .venv/bin/python -m pytest tests/ -q
#
# which is currently RED — 5 failed / 1587 passed, tracked as GH-231 (3, verified one-line fix)
# and GH-233 (2, undiagnosed). A red global gate fails phase 1 and halts the chain, so this plan
# CANNOT be fired as a multi-phase run until the suite is green.
#
# Until then, fire lanes individually with marathon-drive.sh using each packet's own scoped gate —
# which is exactly what each packet's marathon-invocation.txt already prints.
#
# Dry-run before firing:
#   .xyz/relay-automation/marathon.sh --plan PROJECT/2-WORKING/MARATHON-2026-07-30-10DAYS/MARATHON.yaml \
#     --pre-advance-cmd '.venv/bin/python -m pytest tests/ -q' --dry-run

