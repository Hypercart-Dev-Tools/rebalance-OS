# MARATHON.yaml — 2026-07-21 bundle: 4 disjoint Python fixes + the carried-forward Focus5Float
# resolution-resilience lane (Swift, extracted unchanged from MARATHON-2026-07-07 Lane C).
#
# Run:
#   .xyz/relay-automation/marathon.sh \
#     --plan PROJECT/2-WORKING/MARATHON-2026-07-21/MARATHON.yaml \
#     --pre-advance-cmd '.venv/bin/python -m pytest tests/ -k "calendar or daily_report or querier or github_scan or github_client or github_knowledge or semantic_index or index_ops or doctor or pulse_web" -q && (cd macOS/Apps/Focus5Float && swift build 2>&1 | tail -20)' \
#     --dry-run
#
# Triage:  this plan is the output of a doc-hygiene + marathon-triage pass on 2026-07-21 —
#          see PROJECT/3-COMPLETED/MARATHON-2026-07-07.md's status line for the Lane C provenance.
# Branch:  not yet cut — this plan has not fired as of 2026-07-21.
#
# ---------------------------------------------------------------------------
# WHY THESE PHASES, IN THIS ORDER
# ---------------------------------------------------------------------------
# Write-sets verified against the tree on 2026-07-21, not inferred from issue titles:
#
#   p1 (#8)   src/rebalance/ingest/{calendar.py,daily_report.py,querier.py}   <- disjoint
#   p2 (#171) src/rebalance/ingest/github_knowledge.py, scripts/github_sync.sh <- disjoint
#   p3 (#167) src/rebalance/ingest/{semantic_index.py,index_ops.py}          <- disjoint
#   p4 (#189) src/rebalance/doctor.py, scripts/pulse_web.py                  <- disjoint
#   p5 (—)    macOS/Apps/Focus5Float/Sources/Focus5Float/*  (Swift)          <- disjoint, different toolchain
#
# All 5 are mutually disjoint — no depends_on chain. marathon.sh still runs phases ONE AT A TIME
# in declared order regardless (no wave/parallel/worktree machinery — same as every prior plan in
# this repo), so the ordering below is for readability, not correctness.
#
# ---------------------------------------------------------------------------
# GATE
# ---------------------------------------------------------------------------
# The --pre-advance-cmd above is ONE command for the whole run (same convention as every prior
# plan here — marathon-drive's per-phase `# gate:` comments below are documentation of intent,
# not wiring). It combines the Python pytest selector for p1-p4 with a `swift build` for p5 so a
# Python-lane change can never silently break the Swift build (they're disjoint, so this should
# always be a no-op check on p1-p4, and the real gate on p5).
#
# Do NOT gate on the full `pytest tests/` — the suite carries pre-existing failures unrelated to
# this plan (see #178, tracked separately, NOT part of this marathon — its file may collide with
# p1's `querier.py`/related project_inference.py path; verify disjointness before ever combining
# them in one plan).
#
# depends_on is a SCALAR, not a list, if you add one later — `depends_on: [phase-id]` parses as
# the literal string "[phase-id]" and fails. (Recorded here because it bit the 2026-07-18
# collectors plan before its first fire.)
#
# ---------------------------------------------------------------------------
# BUILDER / COST
# ---------------------------------------------------------------------------
# Builder defaults to `codex` (subscription-billed). Reviewer `agy` per the repo's standing
# convention (builder and reviewer must be different agent ids). p5 (Swift) has no reviewer
# swap needed beyond that same rule — same harness, different language.

