# MARATHON.yaml — the 10 lanes from MARATHON-PLAN-2026-07-30.md, as marathon.sh phases.
#
# Regenerated 2026-08-02. Supersedes PROJECT/2-WORKING/MARATHON-2026-07-30-10DAYS/MARATHON.yaml,
# which now exists only on the research/marathon-2026-07-30-results branch: the 2026-07-30 run's
# commits were rolled off development, and its packets went with them. Every lane below was
# re-preflighted today against the CURRENT vendored harness (source_commit d017e61) and exited 0
# (ready) — packets under relay-system/preflight/2026-08-02/.
#
# SEQUENCING. marathon.sh runs phases STRICTLY ONE AT A TIME (GH-241); depends_on constrains
# order, it does not create concurrency. The plan document's "waves" describe which lanes COULD
# safely overlap and are therefore advisory here — they are why no depends_on is needed between
# same-wave lanes, not a statement that they run together. Order below is the plan's own ranking
# (score ascending), which is also its wave order.
#
# GATE — CHANGED SINCE 2026-07-30. marathon.sh takes ONE --pre-advance-cmd for the whole run;
# there is no per-phase gate field, and the packets' issue-scoped gates cannot be reproduced by a
# single command. The only command broad enough to cover every lane is the full suite:
#
#     .venv/bin/python -m pytest tests/ -q
#
# The 2026-07-30 plan could not fire as a multi-phase run because that suite was RED (5 failed,
# GH-231 + GH-233). Both fixes are now on development (c86ea34, 5b992a2) and the suite is GREEN —
# 1592 passed, 15 skipped, 10 xfailed, verified 2026-08-02. The global gate is therefore viable
# for the first time, and this plan CAN be fired as a chain.
#
# A red gate still halts the chain at the failing phase. Lanes after a halt do not run; re-fire
# from the remaining phases after triaging the failure.
#
# GATE GUARD (XYZ GH-390). The gate executes code a builder wrote seconds earlier. On 2026-07-30
# a generated constant-mock test drove an unbounded pagination loop in this repo's
# health_issue_reporter (rebalance GH-236) and panicked the host twice — the p5-gh139 lane below
# is the same lane that did it, and that bug is deliberately still unfixed here so this run
# exercises the guard. The vendored harness now caps the gate on wall-clock, CPU (ulimit -t), and
# process-group RSS, and reports a resource kill as `gate-killed` rather than `pre-advance-failed`
# so it is never mistaken for the change having failed review.
#
# Dry-run before firing:
#   .xyz/relay-automation/marathon.sh --plan PROJECT/2-WORKING/MARATHON-2026-08-02-10DAYS/MARATHON.yaml \
#     --pre-advance-cmd '.venv/bin/python -m pytest tests/ -q' --dry-run

