# PHASE IDS carry an -0802 suffix deliberately. The tick coordination ledger lives in .tick/,
# which is gitignored — so rolling the 2026-07-30 run's commits off development did NOT roll back
# its task state. MARATHON-P1..P4-GH***-TURN are still `done` and MARATHON-P5-GH139-TURN is still
# `open` from that run, and a spent id is permanently unclaimable ("only the claiming agent can
# mutate it"), which halts the phase before any turn runs. marathon.sh --retry rewrites one
# phase's id; five were spent here, so the ids are freshened in the plan instead. Verified unused
# via `tick info` before firing.
