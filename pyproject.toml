[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebalance-os"
version = "0.69.3"
description = "Local-first workday operating system with MCP tools and Obsidian ingest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.1",
  "questionary>=2.0.1",
  # Capped at <2: mcp 2.0.0 removed mcp.server.fastmcp, which src/rebalance/mcp/
  # imports in 8 modules. See GH-225.
  "mcp>=1.0.0,<2",
  "sqlite-vec>=0.1.6",
  "keyring>=25.0.0",
]

[project.optional-dependencies]
calendar = [
  "google-api-python-client>=2.0.0",
  "google-auth-oauthlib>=1.0.0",
  "google-auth-httplib2>=0.2.0",
]
embeddings = [
  "mlx-embeddings>=0.1.0",
]
server = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
]
gcp = [
  "google-cloud-secret-manager>=2.0.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6",
]

[project.scripts]
rebalance = "rebalance.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship SQL migration files inside the wheel so run_migrations() can find them.
"rebalance.ingest.db" = ["migrations/*.sql"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Lint scope is the product trees; everything else at the repo root is
# vendored, generated, or process artifacts.
extend-exclude = [
  "macOS",
  "vscode-extensions",
  "temp",
  "relay-system",
  "ask_self",
  "git-pulse-sync",
  "graphify-out",
  "experimental",
  ".swe-diagram",
  "phases",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
  # Long-line backlog: ~170 lines exceed 120 today. Burn down and re-enable (GH-298).
  "E501",
  # typer.Option(...) defaults are the CLI framework's idiom, not a bug.
  "B008",
  # Optional heavy deps are deliberately lazy-imported after capability checks.
  "E402",
  # Legacy raise-without-from and unbounded zip() sites; tighten in a follow-up.
  "B904",
  "B905",
]

[tool.ruff.lint.per-file-ignores]
# Broad assertRaises(Exception) is acceptable in tests for now.
"tests/**" = ["B017"]
"utils/3-eyes/tests/**" = ["B017"]
# Legacy re-export shim: domain names stay importable from the old paths.
"src/rebalance/cli/__init__.py" = ["F401"]
