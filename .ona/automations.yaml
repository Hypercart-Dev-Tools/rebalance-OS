tasks:
  install-dependencies:
    name: Install dependencies
    command: |
      python -m pip install --upgrade pip
      python -m pip install -e ".[calendar,server]" pytest
    triggeredBy:
      - postDevcontainerStart

  test:
    name: Run tests
    command: |
      python -m pytest tests/ -q
    dependsOn:
      - install-dependencies
    triggeredBy:
      - manual

services:
  web-dashboard:
    name: Rebalance web dashboard
    description: Local FastAPI dashboard exposed by the rebalance CLI
    commands:
      start: |
        rebalance serve --host 0.0.0.0 --port 8787
      ready: |
        curl -sf http://localhost:8787/ >/dev/null
    triggeredBy:
      - manual
